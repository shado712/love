<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستقبل رقية البطلة ✨</title>
    <style>
        :root { --purple: #2d004d; --gold: #ffd700; --white: #ffffff; }
        body { 
            background: radial-gradient(circle, #1a0033, #000); 
            margin: 0; font-family: 'Cairo', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; color: var(--white);
        }

        /* تكثيف المؤثرات المتحركة */
        .rain { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .drop { position: absolute; animation: fall linear infinite; filter: drop-shadow(0 0 5px var(--gold)); }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .card { 
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 40px; border: 2px solid var(--gold);
            width: 85%; max-width: 400px; text-align: center; position: relative; z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .sticker { width: 130px; height: 130px; margin-bottom: 15px; transition: 0.5s; }
        h1 { color: var(--gold); font-size: 24px; margin-bottom: 10px; }
        p { font-size: 17px; line-height: 1.7; min-height: 120px; margin-bottom: 20px; }

        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; }
        .progress-bar { width: 10%; height: 100%; background: var(--gold); border-radius: 10px; transition: 0.4s; }

        .btn { 
            background: var(--gold); color: black; border: none; padding: 15px; 
            border-radius: 25px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="rain" id="rain"></div>

    <div class="card">
        <img src="https://media.tenor.com/OnY_qNqE4p8AAAAi/hello-kitty-shy.gif" class="sticker" id="img">
        <h1 id="title">يا هلا برقوية ✨</h1>
        <div class="progress-container"><div class="progress-bar" id="bar"></div></div>
        <p id="text">رقية، هذا الموقع سواه الج حيدر.. حتى يذكرج انج ذكية وبطلة والثالث متوسط انتي كدها وأكثر!</p>
        <button class="btn" onclick="nextPage()" id="btn">يلا نبدأ؟ 🚀</button>
    </div>

    <script>
        // صنع مطر من أيقونات الدراسة
        const icons = ['📚', '✍️', '🎓', '💡', '📝', '✨', '📖', '🏆', '📒', '✏️'];
        function createRain() {
            const d = document.createElement('div');
            d.className = 'drop';
            d.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            d.style.left = Math.random() * 100 + 'vw';
            d.style.fontSize = (Math.random() * 20 + 15) + 'px';
            d.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.getElementById('rain').appendChild(d);
            setTimeout(() => d.remove(), 4000);
        }
        setInterval(createRain, 200);

        let step = 0;
        const pages = [
            { t: "أول خطوة للنجاح", p: "رقية، الثالث هو بوابتج للإعدادية ولأحلامج الكبيرة. لا تخلين الخوف يوكف بوجهج، أنتي أقوى من الكتاب!", s: "https://media.tenor.com/vH97Zf_9680AAAAi/hello-kitty-flower.gif", b: "20%" },
            { t: "تعبج مراح يضيع", p: "كل كلمة تقريها هسة، هي استثمار لمستقبلج. الله يشوف تعبج وراح يجازيج بأحلى معدل يفرح كلبج.", s: "https://media.tenor.com/K_f9_9Obeo0AAAAi/hello-kitty-blushing.gif", b: "30%" },
            { t: "فخر العائلة", p: "تخيلي يوم النتائج، والكل يبارك الج.. دموع الفرح بعين أهلج تسوى الدنيا وما بيها. إحنا كلنا ننتظرج!", s: "https://media.tenor.com/j_6W_Xq-S0AAAAAi/hello-kitty-sanrio.gif", b: "40%" },
            { t: "انتي ذكية!", p: "مو أي وحدة توصل للثالث وتجتهد مثلج. رقية، عقلج ذهب بس يحتاج شوية تركيز واصرار.", s: "https://media.tenor.com/OnY_qNqE4p8AAAAi/hello-kitty-shy.gif", b: "50%" },
            { t: "حيدر وياج دوم", p: "لو شكد ما جانت المادة صعبة، تذكري اني موجود واسندج. ادرسي وسوي اللي عليج والباقي على رب العالمين.", s: "https://media.tenor.com/V7_5zWv-A60AAAAi/hello-kitty-love.gif", b: "60%" },
            { t: "وقت الجد", p: "هانت يا بطلة، ما بقى شي وتخلص الامتحانات وتبدي أحلى عطلة وانتي ناجحة ورافع راسنا.", s: "https://media.tenor.com/2m_SAnzXvYgAAAAi/hello-kitty-jet-plane.gif", b: "70%" },
            { t: "احلمي براحتج", p: "تردين تصيرين دكتورة؟ مهندسة؟ محامية؟ كل هالأحلام تبدأ من ورقة وقلم هسة. ادرسي لحلمج!", s: "https://media.tenor.com/vH97Zf_9680AAAAi/hello-kitty-flower.gif", b: "80%" },
            { t: "وعد للنجاح؟", p: "أريد منج وعد يا رقية، انو متبجين من مادة صعبة، بل تحاولين مرة ومرتين لحد ما تسيطرين عليها.", s: "https://media.tenor.com/K_f9_9Obeo0AAAAi/hello-kitty-blushing.gif", b: "90%" },
            { t: "القمة تنتظرج", p: "رقية ما ترضى بس بالنجاح، رقية ترضى بالامتياز! يلا يا بطلة، شدي الحيل بكل قوتج.", s: "https://media.tenor.com/j_6W_Xq-S0AAAAAi/hello-kitty-sanrio.gif", b: "95%" },
            { t: "كلمة أخيرة", p: "أحبج يا أختي الصغيرة، ومنتظر أشوفج أحسن وحدة بالدنيا. روحي هسة ادرسي وبشرينا بالإبداع! ❤️", s: "https://media.tenor.com/OnY_qNqE4p8AAAAi/hello-kitty-shy.gif", b: "100%" }
        ];

        function nextPage() {
            if(step < pages.length) {
                document.getElementById('title').innerText = pages[step].t;
                document.getElementById('text').innerText = pages[step].p;
                document.getElementById('img').src = pages[step].s;
                document.getElementById('bar').style.width = pages[step].b;
                document.getElementById('btn').innerText = "كملي القراءة ✨";
                step++;
            } else {
                document.getElementById('text').innerHTML = "كافي نت يا رقية! <br> الكتاب يصيحج هسة.. روحي ادرسي! ❤️🎓";
                document.getElementById('btn').style.display = 'none';
                document.getElementById('img').src = "https://media.tenor.com/V7_5zWv-A60AAAAi/hello-kitty-love.gif";
            }
        }
    </script>
</body>
</html>
